<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1ea">
<title>CodeMitra</title>
<style>
:root{--bg:#f5f1ea;--card:#fffdf9;--tx:#2b2620;--mu:#8a8174;--ac:#c96442;--bd:#e4ddd0;--code:#1f1d1a}
@media(prefers-color-scheme:dark){:root{--bg:#262421;--card:#302d29;--tx:#eee8dd;--mu:#a39a8c;--bd:#433f39;--code:#171614}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;gap:8px;padding:8px 12px}
header h1{flex:1;margin:0;font:600 19px Georgia,serif;text-align:center}
.ib{background:none;border:0;color:var(--tx);font-size:20px;padding:8px;border-radius:10px}
.ib:active{background:var(--bd)}
#side{position:fixed;inset:0 25% 0 0;max-width:300px;background:var(--card);border-right:1px solid var(--bd);transform:translateX(-105%);transition:.25s;z-index:5;padding:calc(env(safe-area-inset-top,0) + 12px) 12px;overflow-y:auto}
#side.open{transform:none}#sh{position:fixed;inset:0;background:#0006;display:none;z-index:4}#sh.open{display:block}
.ci{padding:10px;border-radius:10px;display:flex;justify-content:space-between;gap:6px;font-size:14px}
.ci.on{background:var(--bd)}.ci span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.nb{width:100%;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px;font-size:15px;margin-bottom:10px}
#main{flex:1;overflow-y:auto;padding:8px 16px}
.empty{text-align:center;margin-top:12vh}.empty h2{font:500 28px Georgia,serif;margin:8px 0}.empty p{color:var(--mu)}
.sg{display:flex;flex-direction:column;gap:8px;margin-top:20px}.sg button{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:14px;padding:12px;text-align:left;font-size:14px}
.m{margin:14px 0;max-width:100%;word-wrap:break-word}
.u{background:var(--bd);border-radius:18px;padding:10px 14px;margin-left:auto;width:fit-content;max-width:88%;white-space:pre-wrap}
.b p{margin:0 0 10px;white-space:pre-wrap}
.b code.i{background:var(--bd);padding:1px 5px;border-radius:5px;font-size:.9em}
.cb{background:var(--code);border-radius:12px;margin:8px 0;overflow:hidden}
.ch{display:flex;justify-content:space-between;padding:6px 12px;font-size:12px;color:#aaa;background:#00000030}
.ch button{background:none;border:0;color:#ddd;font-size:12px}
.cb pre{margin:0;padding:12px;overflow-x:auto;color:#e8e2d6;font:13px/1.5 ui-monospace,monospace}
.tl{display:flex;gap:4px;margin-top:2px}.tl button{background:none;border:0;font-size:16px;opacity:.6;padding:4px 8px}
.dots span{display:inline-block;width:8px;height:8px;margin:2px;background:var(--ac);border-radius:50%;animation:d 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}@keyframes d{50%{opacity:.2}}
#box{margin:8px 12px calc(env(safe-area-inset-bottom,0) + 10px);background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:8px 10px;box-shadow:0 2px 10px #0001}
#in{width:100%;border:0;background:none;color:var(--tx);font:inherit;resize:none;outline:none;max-height:140px;padding:6px}
.bar{display:flex;align-items:center;gap:4px}.bar .sp{flex:1}
.pill{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:16px;padding:5px 10px;font-size:13px}
.snd{width:38px;height:38px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:17px}
.rec{background:#d33!important;color:#fff}
#set{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--bd);border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0) + 16px);transform:translateY(105%);transition:.25s;z-index:6}
#set.open{transform:none}#set label{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:15px}
#set input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:9px;font:inherit;font-size:13px}
.seg{display:flex;gap:6px}.seg button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:7px 12px}.seg .on{background:var(--ac);color:#fff;border-color:var(--ac)}
</style></head><body>
<div id="sh" onclick="tog('side',0)"></div>
<aside id="side"><button class="nb" onclick="newChat()">＋ <span id="tnew"></span></button><div id="list"></div></aside>
<header><button class="ib" onclick="tog('side',1)">☰</button><h1>CodeMitra</h1><button class="ib" onclick="tog('set',1)">⚙️</button></header>
<div id="main"></div>
<div id="box"><textarea id="in" rows="1"></textarea>
<div class="bar"><button class="pill" id="lg" onclick="lang()"></button><button class="pill" id="vg" onclick="gender()"></button><span class="sp"></span><button class="ib" id="mic" onclick="listen()">🎤</button><button class="snd" onclick="send()">↑</button></div></div>
<div id="set"><label><b id="tset"></b><button class="ib" onclick="tog('set',0)">✕</button></label>
<label><span id="tspeak"></span><input type="checkbox" id="auto" onchange="S.auto=this.checked;sv()"></label>
<label><span id="tvoice"></span><div class="seg"><button id="vf" onclick="setG('f')">👩</button><button id="vm" onclick="setG('m')">👨</button></div></label>
<label><span id="trate"></span><input type="range" id="rate" min=".6" max="1.4" step=".1" onchange="S.rate=+this.value;sv()"></label>
<small style="color:var(--mu)">Server URL</small><input type="text" id="url" onchange="S.url=this.value.trim().replace(/\/$/,'');sv()"></div>
<script>
var X={hi:{new:"नई चैट",ph:"कोड के बारे में कुछ भी पूछो…",hi:"नमस्ते 👋",sub:"मैं कोडमित्र हूँ। कोडिंग में क्या मदद करूँ?",set:"सेटिंग",speak:"जवाब बोलो",voice:"आवाज़",rate:"स्पीड",err:"सर्वर से जवाब नहीं मिला। Render सर्वर सो रहा हो सकता है, 1 मिनट बाद फिर कोशिश करें।",wait:"सर्वर जाग रहा है…",s:["Python में binary search समझाओ","मेरे कोड का error ढूँढो","HTML में login form बनाओ","JavaScript async/await सिखाओ"]},
en:{new:"New chat",ph:"Ask anything about code…",hi:"Hello 👋",sub:"I am CodeMitra. How can I help you code today?",set:"Settings",speak:"Speak replies",voice:"Voice",rate:"Speed",err:"No reply from the server. The free Render server may be asleep, try again in a minute.",wait:"Server is waking up…",s:["Explain binary search in Python","Find the bug in my code","Build a login form in HTML","Teach me JavaScript async/await"]}};
var S={lang:"hi",g:"f",rate:1,auto:false,url:"https://codemitra-backend-tcdt.onrender.com",chats:[],cur:null};
try{var o=JSON.parse(localStorage.getItem("cm2")||"null");if(o)S=Object.assign(S,o)}catch(e){}
function sv(){try{localStorage.setItem("cm2",JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}function T(k){return X[S.lang][k]}
function tog(id,on){$(id).classList.toggle("open",!!on);if(id==="side")$("sh").classList.toggle("open",!!on)}
function esc(t){return t.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function md(t){var out="",parts=t.split(/```/);
 parts.forEach(function(p,i){if(i%2){var nl=p.indexOf("\n"),lg=p.slice(0,nl).trim()||"code",c=p.slice(nl+1).replace(/\n$/,"");
  out+='<div class="cb"><div class="ch"><span>'+esc(lg)+'</span><button onclick="cp(this)">Copy</button></div><pre>'+esc(c)+'</pre></div>'}
 else if(p.trim()){out+='<p>'+esc(p.trim()).replace(/`([^`]+)`/g,'<code class="i">$1</code>').replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")+'</p>'}});return out}
function cp(b){try{navigator.clipboard.writeText(b.parentNode.nextSibling.textContent);b.textContent="✓"}catch(e){}setTimeout(function(){b.textContent="Copy"},1200)}
function chat(){return S.chats.find(function(c){return c.id===S.cur})}
function newChat(){var c={id:Date.now(),t:"—",m:[]};S.chats.unshift(c);S.cur=c.id;sv();tog("side",0);render()}
function pick(id){S.cur=id;sv();tog("side",0);render()}
function delc(e,id){e.stopPropagation();S.chats=S.chats.filter(function(c){return c.id!==id});if(S.cur===id)S.cur=null;sv();render()}
function render(){
 $("in").placeholder=T("ph");$("tnew").textContent=T("new");$("tset").textContent=T("set");$("tspeak").textContent=T("speak");$("tvoice").textContent=T("voice");$("trate").textContent=T("rate");
 $("lg").textContent=S.lang==="hi"?"हिं":"EN";$("vg").textContent=S.g==="f"?"👩":"👨";
 $("vf").className=S.g==="f"?"on":"";$("vm").className=S.g==="m"?"on":"";$("auto").checked=S.auto;$("rate").value=S.rate;$("url").value=S.url;
 $("list").innerHTML=S.chats.map(function(c){return '<div class="ci '+(c.id===S.cur?"on":"")+'" onclick="pick('+c.id+')"><span>'+esc(c.t)+'</span><button class="ib" style="padding:0;font-size:14px" onclick="delc(event,'+c.id+')">🗑</button></div>'}).join("");
 var c=chat(),h="";
 if(!c||!c.m.length){h='<div class="empty"><div style="font-size:42px">🤖</div><h2>'+T("hi")+'</h2><p>'+T("sub")+'</p><div class="sg">'+T("s").map(function(s){return '<button onclick="ask(this.textContent)">'+esc(s)+'</button>'}).join("")+'</div></div>'}
 else c.m.forEach(function(m,i){h+=m.r==="u"?'<div class="m u">'+esc(m.c)+'</div>':'<div class="m b">'+md(m.c)+'<div class="tl"><button onclick="speak('+i+')">🔊</button><button onclick="cpm('+i+')">📋</button></div></div>'});
 $("main").innerHTML=h;$("main").scrollTop=1e9}
function cpm(i){try{navigator.clipboard.writeText(chat().m[i].c)}catch(e){}}
function ask(t){$("in").value=t;send()}
var busy=false;
async function send(){var q=$("in").value.trim();if(!q||busy)return;$("in").value="";$("in").style.height="auto";
 if(!chat())newChat();var c=chat();if(!c.m.length)c.t=q.slice(0,40);
 var hist=c.m.slice(-6).map(function(m){return{role:m.r==="u"?"user":"assistant",content:m.c}});
 c.m.push({r:"u",c:q});render();busy=true;
 $("main").insertAdjacentHTML("beforeend",'<div class="m b" id="ty"><div class="dots"><span></span><span></span><span></span></div></div>');$("main").scrollTop=1e9;
 var slow=setTimeout(function(){var t=$("ty");if(t&&t.querySelector(".dots"))t.innerHTML="<small>"+T("wait")+"</small>"},6000);
 var full="";
 try{var r=await fetch(S.url+"/chat/stream",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:q,lang:S.lang,history:hist})});
  if(!r.ok||!r.body)throw 0;var rd=r.body.getReader(),dc=new TextDecoder();
  while(true){var x=await rd.read();if(x.done)break;full+=dc.decode(x.value,{stream:true});clearTimeout(slow);var t=$("ty");if(t)t.innerHTML=md(full);$("main").scrollTop=1e9}
  if(!full.trim())throw 0;c.m.push({r:"a",c:full})}
 catch(e){c.m.push({r:"a",c:full||T("err")})}
 clearTimeout(slow);busy=false;sv();render();if(S.auto&&full)say(full)}
$("in").addEventListener("input",function(){this.style.height="auto";this.style.height=this.scrollHeight+"px"});
$("in").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey&&innerWidth>700){e.preventDefault();send()}});
var V=[];function lv(){try{V=speechSynthesis.getVoices()}catch(e){}}lv();try{speechSynthesis.onvoiceschanged=lv}catch(e){}
function voice(){var k=S.lang==="hi"?"hi":"en",c=V.filter(function(v){return v.lang.toLowerCase().indexOf(k)===0});
 var f=/female|zira|heera|swara|neerja|samantha|kalpana|aditi|priya|lekha/i,m=/\bmale\b|ravi|hemant|prabhat|david|mark|rishi|madhur/i;
 var w=c.filter(function(v){return S.g==="f"?f.test(v.name)&&!/\bmale\b/i.test(v.name):m.test(v.name)});return w[0]||c[0]||null}
function speak(i){say(chat().m[i].c)}
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g,S.lang==="hi"?" कोड स्क्रीन पर है। ":" code is on screen. "));
 u.lang=S.lang==="hi"?"hi-IN":"en-IN";var v=voice();if(v)u.voice=v;u.rate=S.rate;u.pitch=S.g==="f"?1.25:.75;speechSynthesis.speak(u)}catch(e){}}
function lang(){S.lang=S.lang==="hi"?"en":"hi";sv();render()}
function gender(){setG(S.g==="f"?"m":"f")}
function setG(g){S.g=g;sv();render();say(S.lang==="hi"?"नमस्ते":"Hello")}
function listen(){var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert("Voice input not supported in this browser");return}
 var r=new R();r.lang=S.lang==="hi"?"hi-IN":"en-IN";$("mic").classList.add("rec");
 r.onresult=function(e){$("in").value=e.results[0][0].transcript;send()};r.onend=r.onerror=function(){$("mic").classList.remove("rec")};r.start()}
render();
</script></body></html>
