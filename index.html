<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131b"><title>CodeMitra · AI Coding Companion</title>
<style>
:root{color-scheme:dark;--bg:#0d1017;--panel:#171e2a;--line:#2b3549;--text:#edf2ff;--muted:#9aa8bd;--accent:#9182ff;--mint:#62dbc4}*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 12% 0%,#30275a,transparent 38%),radial-gradient(ellipse at 95% 100%,#123e3b,transparent 32%),var(--bg);color:var(--text);font:15px/1.55 system-ui,sans-serif}button,textarea,input{font:inherit}button{cursor:pointer;color:inherit}#app{height:100%;display:flex}.side{width:265px;flex-shrink:0;background:#111722ee;border-right:1px solid var(--line);padding:18px 13px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;gap:10px;align-items:center;padding:2px 5px 20px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#a99aff,#62dbc4);display:grid;place-items:center;color:#111;font-weight:900;font-size:20px}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:11px}.new{width:100%;padding:11px;border:1px solid #9182ff66;background:#9182ff18;border-radius:12px;text-align:left;font-weight:650}.label{padding:22px 8px 8px;color:#78869c;font-size:10px;letter-spacing:1.5px;text-transform:uppercase}#history{flex:1;overflow:auto}.item{display:flex;gap:7px;padding:9px;border-radius:9px;color:#bdc7d8;font-size:13px;cursor:pointer}.item.active,.item:hover{background:#ffffff10}.item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.del{background:none;border:0;color:#9aa8bd}.sidefoot{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}.sidefoot button{flex:1;background:none;border:1px solid var(--line);border-radius:9px;padding:8px;color:var(--muted);font-size:12px}.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:62px;flex-shrink:0;border-bottom:1px solid #2b354988;display:flex;align-items:center;justify-content:space-between;padding:0 23px;background:#0d101799;backdrop-filter:blur(16px)}.top-left{display:flex;align-items:center;gap:12px}.top small{color:var(--mint);display:block;font-size:11px}.icon{width:37px;height:37px;border:1px solid var(--line);border-radius:10px;background:#ffffff08}.mobile{display:none}#messages{flex:1;overflow:auto;padding:28px max(18px,calc((100% - 820px)/2))}.welcome{max-width:700px;text-align:center;margin:8vh auto 0}.mark{width:65px;height:65px;margin:auto;border-radius:22px;background:#9182ff24;border:1px solid #9182ff55;display:grid;place-items:center;font-size:29px}.welcome h1{font-size:clamp(28px,4vw,40px);letter-spacing:-1px;margin:17px 0 5px}.welcome h1 em{font-style:normal;color:#aaa0ff}.welcome p{color:var(--muted);margin:0 0 25px}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}.suggestions button{border:1px solid var(--line);background:#ffffff08;border-radius:13px;padding:13px;color:#cbd4e5;text-align:left}.suggestions button:hover{border-color:#9182ff}.suggestions b{display:block;color:white}.suggestions small{color:var(--muted)}.msg{display:flex;gap:11px;margin:0 0 24px;align-items:flex-start}.msg.user{flex-direction:row-reverse}.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:10px;background:#9182ff25;display:grid;place-items:center;color:#c6bcff}.user .avatar{background:#62dbc425;color:#62dbc4}.bubble{min-width:0;max-width:min(760px,calc(100% - 42px));color:#dce5f4}.user .bubble{white-space:pre-wrap;background:#9182ff1c;border:1px solid #9182ff33;border-radius:15px 4px 15px 15px;padding:10px 14px;color:#f4f0ff}.assistant .bubble{flex:1;padding:1px 0}.bubble p{margin:0 0 11px}.bubble h1,.bubble h2,.bubble h3{margin:17px 0 8px}.bubble ul,.bubble ol{padding-left:22px}.bubble code.inline{background:#273044;color:#c3baff;border-radius:4px;padding:2px 5px;font:.9em ui-monospace,monospace}.code{background:#090d14;border:1px solid #303b51;border-radius:11px;margin:10px 0;overflow:hidden}.codehead{background:#192131;padding:6px 10px;display:flex;justify-content:space-between;color:#9eabc0;font-size:11px}.codehead button{background:none;border:1px solid #39445a;border-radius:6px;font-size:11px}.code pre{padding:13px;margin:0;overflow:auto;color:#dce5f4;font:12px/1.6 ui-monospace,monospace}.actions button{background:none;border:0;color:#91a0b7;font-size:11px;padding:6px}.typing{color:#a99aff}.composer-wrap{padding:10px 15px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 25%)}.composer{max-width:820px;margin:auto;border:1px solid #39445a;border-radius:17px;background:var(--panel);padding:10px;box-shadow:0 14px 45px #0005}.composer:focus-within{border-color:#9182ff}.composer textarea{width:100%;resize:none;max-height:160px;min-height:30px;border:0;outline:0;background:none;color:var(--text);padding:3px;font:14px/1.5 system-ui}.tools{display:flex;gap:7px;align-items:center}.tools button{border:0;border-radius:9px;background:none;color:var(--muted);padding:7px 9px;font-size:12px}.tools .spacer{flex:1}.tools .send{width:36px;height:36px;background:linear-gradient(135deg,#a99aff,#7065e6);color:white;font-size:19px}.tools .stop{display:none;border:1px solid #ff7785;color:#ff9ba5}.hint{text-align:center;color:#6e7b91;font-size:10px;margin-top:8px}#settings{display:none;position:fixed;z-index:9;right:18px;top:72px;width:min(350px,calc(100vw - 24px));padding:16px;background:#192131;border:1px solid #39445a;border-radius:15px;box-shadow:0 20px 60px #0008}#settings.open{display:block}#settings label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}#settings input[type=text]{width:100%;background:#0e1420;border:1px solid var(--line);border-radius:8px;padding:9px;color:white}#settings input[type=range]{width:100%}#settings button{padding:8px;border-radius:8px;background:#9182ff22;border:1px solid #9182ff55}.backdrop{display:none;position:fixed;inset:0;background:#0008;z-index:8}.backdrop.open{display:block}
@media(max-width:740px){.side{position:fixed;inset:0 auto 0 0;width:min(285px,85vw);transform:translateX(-105%);transition:transform .2s;box-shadow:0 20px 60px #0008}.side.open{transform:none}.mobile{display:block}.top{height:57px;padding:0 12px}#messages{padding:20px 13px}.welcome{margin:6vh auto 0}.suggestions{grid-template-columns:1fr}.composer-wrap{padding:8px 9px max(12px,env(safe-area-inset-bottom))}.del{opacity:1}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div id="app"><aside class="side" id="side"><div class="brand"><div class="logo">C</div><div><b>CodeMitra</b><small>AI coding companion</small></div></div><button class="new" id="new">＋ New conversation</button><div class="label">Recent chats</div><div id="history"></div><div class="sidefoot"><button id="clear">Clear history</button><button id="about">About</button></div></aside><main class="main"><header class="top"><div class="top-left"><button class="icon mobile" id="menu">☰</button><div><b>CodeMitra</b><small id="status">Ready to help</small></div></div><button class="icon" id="settingsBtn">⚙</button></header><section id="messages" aria-live="polite"></section><footer class="composer-wrap"><div class="composer"><textarea id="prompt" rows="1" placeholder="Ask CodeMitra anything about code…" aria-label="Message"></textarea><div class="tools"><button id="lang">EN / हिं</button><button id="mic">🎙 Voice</button><span class="spacer"></span><button class="stop" id="stop">Stop</button><button class="send" id="send">↑</button></div></div><div class="hint">Enter to send · Shift + Enter for a new line · Verify important code before using it</div></footer></main></div><div class="backdrop" id="backdrop"></div><section id="settings"><b>Settings</b><label for="url">Backend server URL</label><input id="url" type="text"><label><input id="autospeak" type="checkbox"> Speak AI replies</label><label for="rate">Speech speed</label><input id="rate" type="range" min=".7" max="1.3" step=".1"><p><button id="test">Check backend</button> <small id="testResult"></small></p></section>
<script>
(function(){
var $=function(x){return document.getElementById(x)},DEFAULT='https://codemitra-backend-tcdt.onrender.com',S={lang:'en',url:DEFAULT,chats:[],current:null,auto:false,rate:1};try{S=Object.assign(S,JSON.parse(localStorage.getItem('codemitra-v3')||'{}'))}catch(e){}
var busy=false,controller=null,rec=null;
function save(){try{localStorage.setItem('codemitra-v3',JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function chat(){return S.chats.find(function(c){return c.id===S.current})||null}
function status(s){$('status').textContent=s}
function renderText(src){var parts=String(src).split(/\x60{3}/),out='';parts.forEach(function(p,i){if(i%2){var n=p.indexOf('\n'),lang=n<0?'code':p.slice(0,n).trim()||'code',code=n<0?p:p.slice(n+1).replace(/\n$/,'');out+='<div class="code"><div class="codehead"><span>'+esc(lang)+'</span><button data-codecopy>Copy code</button></div><pre><code>'+esc(code)+'</code></pre></div>';return}var lines=p.split('\n'),buf=[],mode='';function flush(){if(!buf.length)return;var t=buf.join('\n');if(mode==='ul'||mode==='ol')out+='<'+mode+'>'+buf.map(function(x){return '<li>'+esc(x.replace(/^\s*(?:[-*+]|\d+\.)\s+/,''))+'</li>'}).join('')+'</'+mode+'>';else out+='<p>'+esc(t).replace(/\x60([^\x60]+)\x60/g,'<code class="inline">$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')+'</p>';buf=[];mode=''}lines.forEach(function(l){var h=l.match(/^(#{1,3})\s+(.+)/),u=/^\s*[-*+]\s+/.test(l),o=/^\s*\d+\.\s+/.test(l);if(!l.trim()){flush();return}if(h){flush();out+='<h'+h[1].length+'>'+esc(h[2])+'</h'+h[1].length+'>';return}if(u||o){var m=u?'ul':'ol';if(mode!==m)flush();mode=m;buf.push(l);return}if(mode)flush();mode='p';buf.push(l)});flush()});return out}
function render(){var c=chat(),h='';$('history').innerHTML=S.chats.map(function(x){return '<div class="item '+(x.id===S.current?'active':'')+'" data-id="'+x.id+'"><span>'+esc(x.title)+'</span><button class="del" data-del="'+x.id+'">×</button></div>'}).join('');if(!c||!c.messages.length)h='<div class="welcome"><div class="mark">⌘</div><h1>Build something <em>brilliant.</em></h1><p>Your AI partner for coding, debugging and learning.</p><div class="suggestions"><button data-prompt="Explain this code step by step"><b>⌘ Understand code</b><small>Explain code in simple words</small></button><button data-prompt="Help me debug this error: "><b>⚒ Debug an error</b><small>Find and fix bugs faster</small></button><button data-prompt="Build a responsive HTML landing page"><b>▧ Build a website</b><small>Start a project from scratch</small></button><button data-prompt="Teach me Python with a beginner-friendly example"><b>✧ Learn something</b><small>Practice a language or concept</small></button></div></div>';else c.messages.forEach(function(m,i){h+='<article class="msg '+m.role+'"><div class="avatar">'+(m.role==='user'?'Y':'C')+'</div><div class="bubble">'+(m.role==='user'?esc(m.content):renderText(m.content))+(m.role==='assistant'?'<div class="actions"><button data-copy="'+i+'">Copy</button><button data-speak="'+i+'">Listen</button><button data-regen="'+i+'">↻ Regenerate</button></div>':'')+'</div></article>'});$('messages').innerHTML=h;$('messages').scrollTop=$('messages').scrollHeight;$('lang').textContent=S.lang==='hi'?'हिं / EN':'EN / हिं'}
function newChat(){var c={id:Date.now(),title:'New conversation',messages:[]};S.chats.unshift(c);S.current=c.id;save();render();$('side').classList.remove('open')}
function busyUI(v){busy=v;$('send').disabled=v;$('stop').style.display=v?'inline-block':'none';$('send').textContent=v?'…':'↑'}
async function send(value){var q=(value===undefined?$('prompt').value:value).trim();if(!q||busy)return;$('prompt').value='';$('prompt').style.height='auto';if(!chat())newChat();var c=chat(),hist=c.messages.slice(-8).map(function(m){return {role:m.role,content:m.content}});if(!c.messages.length)c.title=q.slice(0,40);c.messages.push({role:'user',content:q});save();render();busyUI(true);status('Connecting…');var typing=document.createElement('div');typing.className='msg assistant';typing.id='typing';typing.innerHTML='<div class="avatar">C</div><div class="bubble typing">Thinking…</div>';$('messages').appendChild(typing);controller=new AbortController();var full='';try{var r=await fetch(S.url.replace(/\/+$/,'')+'/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,lang:S.lang,history:hist}),signal:controller.signal});if(!r.ok||!r.body)throw Error('HTTP '+r.status);var rd=r.body.getReader(),dec=new TextDecoder();while(true){var x=await rd.read();if(x.done)break;full+=dec.decode(x.value,{stream:true});var t=$('typing');if(t)t.querySelector('.bubble').innerHTML=renderText(full);$('messages').scrollTop=$('messages').scrollHeight}full+=dec.decode();if(!full.trim())throw Error('Empty response')}catch(e){if(e.name==='AbortError'){full=full||'Generation stopped.'}else full=full||'Could not connect to the backend. Check Settings → Backend server URL and confirm the server is awake. ('+e.message+')'}var t=$('typing');if(t)t.remove();c.messages.push({role:'assistant',content:full});save();render();busyUI(false);controller=null;status('Ready to help');if(S.auto)speak(full)}
function stop(){if(controller){status('Stopping…');controller.abort()}}
function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.replace(/\x60{3}[\s\S]*?\x60{3}/g,' code block '));u.lang=S.lang==='hi'?'hi-IN':'en-IN';u.rate=Number(S.rate)||1;speechSynthesis.speak(u)}
$('new').onclick=newChat;$('menu').onclick=function(){$('side').classList.toggle('open')};$('send').onclick=function(){send()};$('stop').onclick=stop;$('lang').onclick=function(){S.lang=S.lang==='hi'?'en':'hi';save();render();$('prompt').placeholder=S.lang==='hi'?'कोड के बारे में कुछ भी पूछें…':'Ask CodeMitra anything about code…'};$('prompt').oninput=function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,160)+'px'};$('prompt').onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('mic').onclick=function(){var API=window.SpeechRecognition||window.webkitSpeechRecognition;if(!API){status('Voice input is not supported in this browser');return}if(rec){rec.stop();return}rec=new API();rec.lang=S.lang==='hi'?'hi-IN':'en-IN';rec.onstart=function(){$('mic').textContent='● Listening'};rec.onresult=function(e){$('prompt').value=e.results[0][0].transcript;send()};rec.onend=function(){rec=null;$('mic').textContent='🎙 Voice'};rec.onerror=function(){status('Voice input failed')};rec.start()};
$('history').onclick=function(e){var d=e.target.closest('[data-del]');if(d){S.chats=S.chats.filter(function(c){return c.id!==Number(d.dataset.del)});if(S.current===Number(d.dataset.del))S.current=S.chats.length?S.chats[0].id:null;save();render();return}var i=e.target.closest('[data-id]');if(i){S.current=Number(i.dataset.id);save();render();$('side').classList.remove('open')}};
$('messages').onclick=function(e){var p=e.target.closest('[data-prompt]');if(p){send(p.dataset.prompt);return}var cc=e.target.closest('[data-codecopy]');if(cc){navigator.clipboard.writeText(cc.closest('.code').querySelector('code').textContent).then(function(){cc.textContent='Copied'});return}var cp=e.target.closest('[data-copy]'),sp=e.target.closest('[data-speak]'),rg=e.target.closest('[data-regen]'),c=chat();if(cp&&c)navigator.clipboard.writeText(c.messages[Number(cp.dataset.copy)].content);if(sp&&c)speak(c.messages[Number(sp.dataset.speak)].content);if(rg&&c){var i=Number(rg.dataset.regen);if(i>0&&c.messages[i-1].role==='user'){var q=c.messages[i-1].content;c.messages=c.messages.slice(0,i);save();render();send(q)}}};
$('clear').onclick=function(){if(confirm('Delete all saved chats on this device?')){S.chats=[];S.current=null;save();render()}};$('about').onclick=function(){alert('CodeMitra — your AI coding companion. Never paste passwords or API keys into chat.')};
$('settingsBtn').onclick=function(){$('settings').classList.toggle('open');$('backdrop').classList.toggle('open')};$('backdrop').onclick=function(){$('settings').classList.remove('open');$('backdrop').classList.remove('open')};
$('url').value=S.url;$('autospeak').checked=S.auto;$('rate').value=S.rate;$('url').onchange=function(){S.url=this.value.trim().replace(/\/+$/,'')||DEFAULT;save()};$('autospeak').onchange=function(){S.auto=this.checked;save()};$('rate').oninput=function(){S.rate=this.value;save()};$('test').onclick=async function(){var o=$('testResult');o.textContent='Checking…';try{var r=await fetch(S.url.replace(/\/+$/,'')+'/',{signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error('HTTP '+r.status);var j=await r.json();o.textContent='Connected · '+j.status}catch(e){o.textContent='Not reachable · '+e.message}};
if(!S.chats.length)S.current=null;else if(!chat())S.current=S.chats[0].id;render();if(S.lang==='hi')$('prompt').placeholder='कोड के बारे में कुछ भी पूछें…';
})();
</script></body></html>
